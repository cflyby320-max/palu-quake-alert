name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs; a cancelled main run would leave a
  # commit with no completed verification.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The repo ROOT is deliberately dependency-free — it deploys as a Fly.io
      # cron and carries no runtime deps. But studio/ is its own dependency
      # island (see studio/render.js: "the ONE place the studio uses a
      # dependency"), and the test suite imports through it. Installing it is
      # not optional: without this step the suite dies at import with
      # ERR_MODULE_NOT_FOUND and silently runs 102 tests instead of 112.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install studio dependencies
        working-directory: studio
        run: npm ci

      # `node --test` exits 0 when it matches no files, so a green tick would
      # otherwise be indistinguishable from having run no tests at all.
      - name: Guard against an empty test run
        run: |
          count=$(ls test/*.test.js 2>/dev/null | wc -l)
          echo "test files matched: $count"
          test "$count" -gt 0

      - name: Run tests
        run: npm test
