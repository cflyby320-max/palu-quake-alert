name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs; a cancelled main run would leave a
  # commit with no completed verification.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # This project has zero runtime and dev dependencies, so there is
      # deliberately no install step and no dependency cache. If a dependency
      # is ever added, add `npm ci` here and a lockfile to the repo.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # `node --test` exits 0 when it matches no files, so a green tick would
      # otherwise be indistinguishable from having run no tests at all.
      - name: Guard against an empty test run
        run: |
          count=$(ls test/*.test.js 2>/dev/null | wc -l)
          echo "test files matched: $count"
          test "$count" -gt 0

      - name: Run tests
        run: npm test
